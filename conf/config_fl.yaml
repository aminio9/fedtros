log_level: "INFO"

paths:
  data_client_1: "data/processed/client_1_train.pt"
  data_client_2: "data/processed/client_2_train.pt"
  data_client_3: "data/processed/client_3_train.pt"
  model_dir: "models/federated_global" 
  closed_set_test_data: "data/processed/closed_set_test.pt"
  class_names: "data/processed/class_names.json"
  figures_dir: "figures"

server:
  address: "127.0.0.1:8090"
  num_rounds: 1
  fraction_fit: 1.0           # Use 100% of clients (3)
  fraction_evaluate: 1.0
  min_fit_clients: 3          # Wait for all 3 clients
  min_evaluate_clients: 3
  min_available_clients: 3
  proximal_mu: 0.1            # FedProx regularization strength

# Metadata about the environment, MUST match your preprocessed data
# !!! RUN 'poetry run python preprocess.py' TO GET THESE VALUES !!!
env_metadata:
  state_dim: 31       # Example: MUST BE UPDATED
  num_actions: 5      # Example: MUST BE UPDATED

# Model config
model:
  state_dim: ${env_metadata.state_dim}
  latent_dim: 8
  num_actions: ${env_metadata.num_actions}

# Training config (passed to each client)
training:
  local_episodes_per_round: 10   # Run 100 episodes locally per FL round
  steps_per_episode: 100
  replay_buffer_size: 10000
  min_buffer_size: 128
  batch_size: 128

  gamma: 0.99
  lr_prior: 0.0001
  lr_q_rl: 0.0001
  tau: 0.005                  # For soft target update
  target_update_freq: 100     # Steps between soft updates

  use_double_dqn: True
  prior_grad_clip_norm: 1.0

  # Epsilon-greedy (decays per episode)
  epsilon_start: 1.0
  epsilon_end: 0.1
  epsilon_decay_rate: 0.99

generator_training:
  enabled: true
  batch_size: 128
  epochs: 50
  rounds: 5
  epochs_per_round: 10
  lr: 0.0005
  min_correct_samples: 256

# --- UPDATED SECTION ---
# Configuration for the one-time preprocessing script
# Based on the BNaT dataset description (Table 1)
preprocess:
  # 1. Input/Output
  raw_file: "data/raw/Bnat.csv"
  output_dir: "data/processed"

  # 2. Splitting
  num_clients: 3              # How many federated clients to create
  closed_set_test_size: 0.2   # 20% of KNOWN data is held back for closed-set test

  # 3. Column Definitions (Based on Table 1 and data snippet)
  
  # The "Data explorer" shows the label column is named 'label'
  label_column: "label"
  
  # Based on Table 1, these are 'D' (Discrete)
  categorical_cols:
    - "protocol_type"
    - "service"
    - "flag"
    
  # Based on Table 1, these are 'C' (Continuous)
  numerical_cols:
    - "duration"
    - "src_bytes"
    - "dst_bytes"
    - "count"
    - "srv_count"
    - "serror_rate"
    - "same_srv_rate"
    - "diff_srv_rate"
    - "srv_serror_rate"
    - "srv_diff_host_rate"
    - "dst_host_count"
    - "dst_host_srv_count"
    - "dst_host_same_srv_rate"
    - "dst_host_diff_srv_rate"
    - "dst_host_same_src_port_rate"
    - "dst_host_serror_rate"
    - "dst_host_srv_diff_host_rate"
    - "dst_host_srv_serror_rate"

  # 4. Open-Set Definition
  #    Based on your text description of 4 attacks + "Normal" from the data snippet.
  #    Any label NOT in this list will be treated as "Unknown".
  known_labels:
    - "Normal"
    - "BP"
    - "DoS"
    - "FoT"
    - "MitM"
