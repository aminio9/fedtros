log_level: "INFO"

device:
  # Prefer "cuda" to force NVIDIA CUDA, "directml" for torch-directml (DX12 GPUs like Radeon Vega/iGPU), "cpu" to disable GPU, or "auto" to auto-detect.
  prefer: "directml"
  allow_cpu_fallback: true   # If false and CUDA is unavailable, startup will raise instead of silently using CPU.
  move_data_to_device: true # Set true to keep dataset tensors on the selected device (GPU) to avoid host<->device hops.

paths:
  data_client_1: "data/processed/client_1_train.pt"
  data_client_2: "data/processed/client_2_train.pt"
  data_client_3: "data/processed/client_3_train.pt"
  model_dir: "models/federated_global" 
  closed_set_test_data: "data/processed/closed_set_test.pt"
  open_set_test_data: "data/processed/open_set_test.pt"
  class_names: "data/processed/class_names.json"
  figures_dir: "figures"
  evt_dir: "evt"

server:
  address: "127.0.0.1:8090"
  # More rounds to let aggregation converge; previously plateaued ~92%
  num_rounds: 25
  fraction_fit: 1.0           # Use 100% of clients (3)
  fraction_evaluate: 1.0
  min_fit_clients: 3          # Wait for all 3 clients
  min_evaluate_clients: 3
  min_available_clients: 3
  # Relax FedProx regularization to avoid underfitting to local data
  proximal_mu: 0.0            # FedAvg; set >0 if clients diverge

# Metadata about the environment, MUST match your preprocessed data
# !!! RUN 'poetry run python preprocess.py' TO GET THESE VALUES !!!
env_metadata:
  state_dim: 31       # Example: MUST BE UPDATED
  num_actions: 4      # Example: MUST BE UPDATED

# Model config
model:
  state_dim: ${env_metadata.state_dim}
  latent_dim: 8
  num_actions: ${env_metadata.num_actions}

# Training config (passed to each client)
training:
  # Increase local work so each round carries more signal
  local_episodes_per_round: 50
  steps_per_episode: 150
  replay_buffer_size: 50000
  min_buffer_size: 2000
  batch_size: 256

  gamma: 0.99
  # Slightly higher LR to speed convergence with deeper buffers
  lr_prior: 0.0003
  lr_q_rl: 0.0003
  tau: 0.01                  # For soft target update
  target_update_freq: 5     # Steps between soft updates

  use_double_dqn: True
  prior_grad_clip_norm: 1.0

  # Epsilon-greedy (decays per episode)
  epsilon_start: 1.0
  epsilon_end: 0.05
  # Faster decay to exploit sooner with more local episodes
  epsilon_decay_rate: 0.90

generator_training:
  enabled: true
  batch_size: 128
  epochs: 15
  rounds: 2
  epochs_per_round: 15
  lr: 0.0005
  min_correct_samples: 256

evt:
  enabled: true
  # Use longer EVT tail and higher known-FPR to raise Unknown recall
  tail_size_percent: 0.2
  min_errors_per_class: 5
  min_tail_size: 5
  q: 0.80
  target_known_fpr: 0.15
  delta_grid: [1e-6, 0.99, 200]
  decision_threshold: 0.05
  per_class_thresholds: true

# --- UPDATED SECTION ---
# Configuration for the one-time preprocessing script
# Based on the BNaT dataset description (Table 1)
preprocess:
  # 1. Input/Output
  raw_file: "data/raw/Bnat.csv"
  output_dir: "data/processed"

  # 2. Splitting
  num_clients: 3              # How many federated clients to create
  closed_set_test_size: 0.2   # 20% of KNOWN data is held back for closed-set test

  # 3. Column Definitions (Based on Table 1 and data snippet)
  
  # The "Data explorer" shows the label column is named 'label'
  label_column: "label"
  
  # Based on Table 1, these are 'D' (Discrete)
  categorical_cols:
    - "protocol_type"
    - "service"
    - "flag"
    
  # Based on Table 1, these are 'C' (Continuous)
  numerical_cols:
    - "duration"
    - "src_bytes"
    - "dst_bytes"
    - "count"
    - "srv_count"
    - "serror_rate"
    - "same_srv_rate"
    - "diff_srv_rate"
    - "srv_serror_rate"
    - "srv_diff_host_rate"
    - "dst_host_count"
    - "dst_host_srv_count"
    - "dst_host_same_srv_rate"
    - "dst_host_diff_srv_rate"
    - "dst_host_same_src_port_rate"
    - "dst_host_serror_rate"
    - "dst_host_srv_diff_host_rate"
    - "dst_host_srv_serror_rate"

  # 4. Open-Set Definition
  #    Based on your text description of 4 attacks + "Normal" from the data snippet.
  #    Any label NOT in this list will be treated as "Unknown".
  known_labels:
    - "Normal"
    - "BP"
    - "DoS"
    # - "FoT"
    - "MitM"
