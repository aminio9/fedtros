log_level: "INFO"

device:
  prefer: "cuda" # Options: "cuda", "cpu", "directml"
  allow_cpu_fallback: true
  move_data_to_device: true

paths:
  # Shared evaluation tensors (identical for all clients)
  closed_set_test_data: "data/processed/shared_closed_set_test.pt"
  open_set_test_data: "data/processed/shared_open_set_test.pt"

  # Client training splits
  data_client_1: "data/processed/client_1_train.pt"
  data_client_2: "data/processed/client_2_train.pt"
  data_client_3: "data/processed/client_3_train.pt"

  model_dir: "models/federated_global"
  class_names: "data/processed/class_names.json"
  figures_dir: "figures"
  evt_dir: "evt"

strategy:
  name: "fmrl_la" # Options: "fedavg", "fedprox", "fmrl_la"
  fmrl_lr: 0.01 # LR for Server Critics
  utility_threshold: 0.1 # Cutoff for selection
  critic_hidden_dim: 64
  # Max agents used to initialize Aggregator size
  max_agents: 6
  warmup_rounds: 2 # Rounds before using utility-based selection

server:
  address: "127.0.0.1:8090"
  num_rounds: 100
  fraction_fit: 1.0
  fraction_evaluate: 1.0
  min_fit_clients: 6
  min_evaluate_clients: 6
  min_available_clients: 6
  proximal_mu: 0.0

env_metadata:
  state_dim: 31 # Run preprocess to verify
  num_actions: 4 # Run preprocess to verify

model:
  state_dim: ${env_metadata.state_dim}
  latent_dim: 32
  num_actions: ${env_metadata.num_actions}

training:
  local_episodes_per_round: 15
  steps_per_episode: 100
  replay_buffer_size: 50000
  min_buffer_size: 512
  batch_size: 512
  gamma: 0.7
  lr_prior: 0.001
  lr_q_rl: 0.001
  tau: 0.01
  target_update_freq: 100
  use_double_dqn: True
  prior_grad_clip_norm: 1.0
  epsilon_start: 1.0
  epsilon_end: 0.01
  epsilon_decay_rate: 0.95

generator_training:
  enabled: true
  batch_size: 128
  epochs: 50
  rounds: 1
  epochs_per_round: 30
  lr: 0.0005
  min_correct_samples: 10

evt:
  enabled: true
  tail_size_percent: 0.2
  min_errors_per_class: 5
  min_tail_size: 5
  q: 0.80
  target_known_fpr: 0.01
  delta_grid: [1e-6, 0.99, 200]
  decision_threshold: 0.1
  per_class_thresholds: true

preprocess:
  output_dir: "data/processed"
  num_clients: 6
  num_shards: 6
  closed_set_test_size: 0.2
  raw_file: "data/raw/Bnat.csv"
  # raw_file: "/content/drive/MyDrive/Bnat.csv"

  label_column: "label"

  alpha: 100 # 0.1 = Very Non-IID, 100.0 = IID (Balanced)

  known_labels:
    - "Normal"
    - "BP"
    - "DoS"
    # - "FoT"
    - "MitM"

hydra:
  run:
    dir: .
  sweep:
    dir: .
    subdir: "."
  output_subdir: null
  job_logging:
    root:
      handlers: [console]
