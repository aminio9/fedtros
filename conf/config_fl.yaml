log_level: "INFO"

device:
  prefer: "directml" # Options: "cuda", "cpu", "directml"
  allow_cpu_fallback: true
  move_data_to_device: true

paths:
  # Client 1
  data_client_1: "data/processed/client_1_train.pt"
  test_closed_client_1: "data/processed/client_1_test_closed.pt"
  test_open_client_1: "data/processed/client_1_test_open.pt"

  # Client 2
  data_client_2: "data/processed/client_2_train.pt"
  test_closed_client_2: "data/processed/client_2_test_closed.pt"
  test_open_client_2: "data/processed/client_2_test_open.pt"

  # Client 3
  data_client_3: "data/processed/client_3_train.pt"
  test_closed_client_3: "data/processed/client_3_test_closed.pt"
  test_open_client_3: "data/processed/client_3_test_open.pt"

  model_dir: "models/federated_global" 
  class_names: "data/processed/class_names.json"
  figures_dir: "figures"
  evt_dir: "evt"

server:
  address: "127.0.0.1:8090"
  num_rounds: 25
  fraction_fit: 1.0
  fraction_evaluate: 1.0
  min_fit_clients: 3
  min_evaluate_clients: 3
  min_available_clients: 3
  proximal_mu: 0.0

env_metadata:
  state_dim: 31       # Run preprocess to verify
  num_actions: 5      # Run preprocess to verify

model:
  state_dim: ${env_metadata.state_dim}
  latent_dim: 16
  num_actions: ${env_metadata.num_actions}

training:
  local_episodes_per_round: 50
  steps_per_episode: 200
  replay_buffer_size: 50000
  min_buffer_size: 1024
  batch_size: 512
  gamma: 0.99
  lr_prior: 0.001
  lr_q_rl: 0.001
  tau: 0.01
  target_update_freq: 100
  use_double_dqn: True
  prior_grad_clip_norm: 1.0
  epsilon_start: 1.0
  epsilon_end: 0.01
  epsilon_decay_rate: 0.995

generator_training:
  enabled: false
  batch_size: 128
  epochs: 15
  rounds: 2
  epochs_per_round: 15
  lr: 0.0005
  min_correct_samples: 256

evt:
  enabled: false
  tail_size_percent: 0.2
  min_errors_per_class: 5
  min_tail_size: 5
  q: 0.80
  target_known_fpr: 0.01
  delta_grid: [1e-6, 0.99, 200]
  decision_threshold: 0.1
  per_class_thresholds: true

preprocess:
  output_dir: "data/processed"
  num_clients: 3
  closed_set_test_size: 0.2

  # --- NEW SECTION: Source Files Map ---
  # Maps client_id to source CSV path
  sources:
    client_1: "data/raw/w1.csv"
    client_2: "data/raw/w2.csv"
    client_3: "data/raw/w3.csv"

  label_column: "label"
  
  categorical_cols:
    - "protocol_type"
    - "service"
    - "flag"
    
  numerical_cols:
    - "duration"
    - "src_bytes"
    - "dst_bytes"
    - "count"
    - "srv_count"
    - "serror_rate"
    - "same_srv_rate"
    - "diff_srv_rate"
    - "srv_serror_rate"
    - "srv_diff_host_rate"
    - "dst_host_count"
    - "dst_host_srv_count"
    - "dst_host_same_srv_rate"
    - "dst_host_diff_srv_rate"
    - "dst_host_same_src_port_rate"
    - "dst_host_serror_rate"
    - "dst_host_srv_diff_host_rate"
    - "dst_host_srv_serror_rate"

  known_labels:
    - "Normal"
    - "BP"
    - "DoS"
    - "FoT"
    - "MitM"