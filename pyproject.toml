[project]
name = "cf-marlos"
version = "0.1.0"
description = "Federated Learning with Open-Set Recognition and Reinforcement"
authors = [{ name = "moha_amini", email = "mhaminii18@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "flwr[simulation] (>=1.29.0,<2.0.0)",
    "torch>=2.4.0,<2.6.0",
    "gymnasium (>=1.2.3,<2.0.0)",
    "hydra-core (>=1.3.2,<2.0.0)",
    "numpy (>=1.26.4,<2.3.0)",
    "tqdm (>=4.67.3,<5.0.0)",
    "pandas (>=2.2.0,<3.0.0)",
    "scikit-learn (>=1.6.0,<2.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "scipy (>=1.13.0,<2.0.0)",
    "joblib (>=1.5.3,<2.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
]

[project.optional-dependencies]
dev = ["ruff>=0.8.0", "pytest>=8.0.0"]

[tool.poetry]
packages = [{ include = "src", from = "." }]

[[tool.poetry.source]]
name = "liara"
url = "https://package-mirror.liara.ir/repository/pypi/simple"
priority = "primary"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
