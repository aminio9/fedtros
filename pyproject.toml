[tool.poetry]
name = "dcids-federated"
version = "0.1.0"
description = "Federated CVAE-DQN for Intrusion Detection using Flower"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
# Flower ^1.9.0 includes NumPyClient as a base class
flwr = {extras = ["simulation"], version = "^1.9.0"}
torch = "^2.2.0"
gymnasium = "^1.0.0"
hydra-core = "^1.3.2"
numpy = "^1.26.4"
tqdm = "^4.66.2"
pandas = "^2.2.0"
scikit-learn = "^1.4.0"
matplotlib = "^3.8.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.main.api"
