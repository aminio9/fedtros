[tool.poetry]
name = "fedosq-chain"
version = "0.1.0"
description = "FedOSQ-Chain: Federated CVAE-DQN for open-set intrusion detection on blockchain traffic"
authors = ["MH Amini <mhaminii18@gmail.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
# Flower ^1.9.0 includes NumPyClient as a base class
flwr = {extras = ["simulation"], version = "^1.9.0"}
torch = "^2.2.0"
gymnasium = "^1.0.0"
hydra-core = "^1.3.2"
numpy = "^1.26.4"
tqdm = "^4.66.2"
pandas = "^2.2.0"
scikit-learn = "^1.4.0"
matplotlib = "^3.8.2"
scipy = "^1.11.4"
joblib = "^1.3.2"
torch-directml = "^0.2.5.dev240914"
seaborn = "^0.13.2"
ray = {extras = ["default"], version = "^2.53.0"}

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.main.api"
