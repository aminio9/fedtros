[tool.poetry]
name = "fedtros-ids"
version = "0.1.0"
description = "FedTROS-PR: Federated Teacher-Regularized Open-Set Recognition with Prototype-Rank Rejection"
authors = ["moha_amini <mhaminii18@gmail.com>"]
readme = "README.md"
packages = [{ include = "src", from = "." }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"

flwr = { version = ">=1.29.0,<2.0.0", extras = ["simulation"] }

torch = { version = "==2.11.0", source = "pytorch-cu128" }

hydra-core = ">=1.3.2,<2.0.0"

numpy = ">=1.26.4,<2.3.0"
pandas = ">=2.2.0,<3.0.0"
scikit-learn = ">=1.6.0,<2.0.0"
scipy = ">=1.13.0,<2.0.0"
joblib = ">=1.5.0,<2.0.0"
tqdm = ">=4.67.0,<5.0.0"

wandb = ">=0.22.0,<1.0.0"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.8.0,<1.0.0"
pytest = ">=8.0.0,<9.0.0"

[[tool.poetry.source]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]