defaults:
  - dataset: bnat
  - model: fedtros
  - optimizer: adam
  - scheduler: none
  - training: default
  - evaluation: default
  - federated: default
  - open_set: fedtros_pr
  - checkpointing: default
  - logging: default
  - tracking: wandb
  - runtime: gpu
  - output: local
  - sweep: none
  - experiment: baseline
  # Global method and stage configs intentionally come after their base groups.
  # Otherwise later defaults overwrite method-specific strategy/training values
  # (for example FedProx's non-zero proximal coefficient).
  - method: fedtros_pr
  - stage: development
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled
  - _self_

seed: 42
log_level: ${logging.level}

device:
  prefer: ${runtime.device_prefer}
  allow_cpu_fallback: ${runtime.allow_cpu_fallback}
  move_data_to_device: ${runtime.move_data_to_device}
  deterministic: ${runtime.deterministic}
  benchmark: ${runtime.benchmark}
  use_deterministic_algorithms: ${runtime.use_deterministic_algorithms}

run_dir: ${tracking.run_dir}
runs: []

checkpoint:
  path: ${checkpointing.latest_checkpoint_path}

paths:
  known_train_data: ${dataset.preprocessing.output_dir}/known_train.pt
  validation_data: ${dataset.preprocessing.output_dir}/validation.pt
  closed_set_test_data: ${dataset.preprocessing.output_dir}/shared_closed_set_test.pt
  open_set_test_data: ${dataset.preprocessing.output_dir}/shared_open_set_test.pt
  data_client_template: ${dataset.preprocessing.output_dir}/client_{client_id}_train.pt
  data_client_1: ${dataset.preprocessing.output_dir}/client_1_train.pt
  model_dir: ${checkpointing.dir}
  class_names: ${dataset.preprocessing.output_dir}/class_names.json
  global_model_checkpoint: ${checkpointing.latest_checkpoint_path}

model_metadata:
  feature_dim: ${model.feature_dim}
  num_classes: ${model.num_classes}

preprocess: ${dataset.preprocessing}
server: ${federated.server}
strategy: ${federated.strategy}

hydra:
  run:
    dir: .
  sweep:
    dir: .
    subdir: .
  output_subdir: null
