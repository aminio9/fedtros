defaults:
  - logging: default
  - _self_

seed: 42

device:
  prefer: cpu
  allow_cpu_fallback: false
  move_data_to_device: false
  deterministic: true
  benchmark: false
  use_deterministic_algorithms: false

experiment:
  name: suite_artifacts
  method: suite
  description: Suite-level artifact aggregation

dataset:
  name: suite
  preprocessing:
    output_dir: outputs/suite_artifacts/processed

model:
  name: suite

runs: []

tracking:
  output_dir: outputs
  run_id: suite_artifacts
  run_dir: ${tracking.output_dir}/${tracking.run_id}
  metrics_jsonl: ${tracking.run_dir}/metrics.jsonl
  metrics_csv: ${tracking.run_dir}/metrics.csv
  metadata_json: ${tracking.run_dir}/metadata.json
  config_yaml: ${tracking.run_dir}/config.yaml
  resolved_config_yaml: ${tracking.run_dir}/resolved_config.yaml

run_dir: ${tracking.run_dir}

hydra:
  run:
    dir: .
  sweep:
    dir: .
    subdir: .
  output_subdir: null
