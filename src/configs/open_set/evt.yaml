name: evt
enabled: true
method: fed_digos

evt:
  enabled: true
  backend: fed_digos
  unknown_label_id: -1
  open_set_label_id: 99
  evaluate_each_round: false
  evaluate_every_n_rounds: 1
  round_eval_dir: open_set_rounds
  save_round_scores: true

fed_digos:
  enabled: true
  # Fed-DiGOS = federated student classifier + disentangled student OSR generator.
  # The private RL teacher generator is not trained/aggregated for the main OSR path.
  detach_features: true
  batch_size: 256
  local_epochs: 2
  # Hard fail if unknown/invalid labels ever reach OSR local training.
  # Unknowns must appear only in open_set_test/final evaluation.
  strict_no_unknown_train: true
  beta_kl: 0.02
  recon_weight: 1.0
  # Smoke-test diagnostics showed raw reconstruction beats recon+NLL; keep NLL small.
  latent_nll_weight: 0.02
  grad_clip_norm: 5.0

  pseudo_unknown:
    enabled: true
    # Use harder, near-boundary pseudo-unknowns. Earlier defaults made fake
    # unknowns too easy and did not teach FoT-like Normal-adjacent rejection.
    ratio: 1.00
    margin: 0.40
    margin_weight: 0.15
    mixup_alpha: 1.0
    mask_probability: 0.05
    noise_std: 0.01

  proser:
    enabled: true
    # FedPD++ local OSR training uses PROSER-style classifier/data placeholders:
    # K known logits + one K+1 placeholder, trained from known samples plus
    # feature-level/input mixup. No real FoT/unknown is used.
    score_type: margin   # margin | prob
    weight: 1.0
    known_weight: 1.0
    masked_placeholder_weight: 0.25
    boundary_placeholder_weight: 1.0
    feature_mixup_weight: 1.0
    detach_features: true
    label_smoothing: 0.02

  energy:
    enabled: true
    temperature: 1.0
    # Use two-sided known-only calibration by default. Raw logit energy can drift
    # during FL; both unusually low and high calibrated energy are suspicious.
    # Options: low, high, two_sided.
    rank_direction: two_sided
    # Optional head-only energy margin training on known + synthetic boundary
    # samples. This uses the global student head, not the local teacher.
    train_margin_enabled: true
    train_margin_weight: 0.05
    known_ce_weight: 0.10
    known_margin: 2.0
    boundary_margin: 1.0

  score_fusion:
    # Default main score is the FedPD++/PROSER K+1 placeholder rank.
    # Generator, energy, prototype, and all fusions are still evaluated/logged
    # every round as ablations.
    # Options: proser_rank, generator_rank, energy_rank, prototype_rank, mean_rank, weighted_rank, max_rank.
    method: proser_rank
    calibration_scope: global
    generator_score_column: recon_error
    decision_rule: selected_rank_threshold
    weights:
      proser: 0.40
      generator: 0.25
      energy: 0.10
      prototype: 0.25

  # Paper-style Positive-Negative Prototypes Fusion Framework (PNPFF).
  # This head is fitted once from a deterministic known-only validation split
  # after federated student aggregation. It is not fitted or executed by clients.
  # The historical name `prototype_rank` is retained for CLI compatibility, but
  # now means the direct PNPFF unknown score from Equations 27-28.
  pnpff:
    feature_dim: 128
    num_positive_prototypes: 7
    gamma1: 1.0
    gamma2: 1.0
    lambda0: 0.10
    lambda1: 0.10
    lambda2: 0.01
    diversity_temperature: 10.0
    eta: 0.50
    omega: 0.50
    fit_fraction: 0.70
    seed: ${seed}
    epochs: 100
    batch_size: 256
    learning_rate: 0.10
    momentum: 0.90
    weight_decay: 0.0
    lr_milestones: [30, 60, 90]
    lr_gamma: 0.10
    threshold_mode: fixed  # fixed | known_fpr
    tau: 0.50
    target_known_fpr: 0.05
    checkpoint_output: pnpff_state.pt

  prototype:
    enabled: true
    # Legacy post-hoc KMeans settings retained only for old resolved configs.
    # New runs use the PNPFF block above for the prototype component.
    # Use the disentangled OSR latent mean rather than the closed-set backbone.
    # Closed-set features drift as classification improves; OSR latent features
    # are trained for reconstruction/open-set geometry.
    feature_source: osr_mu    # osr_mu | classifier_feature
    normalize: true
    radius_quantile: 0.95
    # Normal traffic is broad/multi-modal; using more prototypes avoids one huge
    # Normal ball swallowing FoT.
    num_prototypes_per_class: 16
    min_samples_per_prototype: 25
    negative:
      enabled: true
      # Known-only boundary prototypes generated by mixing calibration features
      # from different known classes. No real unknown/FoT is used.
      num_prototypes: 32
      max_samples: 5000
      mixup_alpha: 1.0
      noise_std: 0.005
      radius_quantile: 0.75
      weight: 0.35
      random_seed: 42

  aggregation:
    enabled: true
    min_samples: 500
    min_label_coverage: 0.0  # legacy/ignored: server does not receive label coverage
    min_class_entropy: 0.0   # legacy/ignored: server does not receive class entropy
    min_score_gap: 0.0
    quality_target_gap: 0.5

  evt:
    classwise: true
    threshold_method: mef
    tail_size_percent: 0.10
    mef_min_quantile: 0.70
    mef_max_quantile: 0.98
    mef_num_candidates: 40
    min_errors_per_class: 50
    min_tail_size: 20
    target_known_fpr: 0.05
    fit_correct_only: true

  logging:
    save_scores: true
    save_quantiles: true
    save_overlap_report: true
