name: evt
enabled: true
method: fed_digos

evt:
  enabled: true
  backend: fed_digos
  unknown_label_id: -1
  open_set_label_id: 99
  evaluate_each_round: false
  evaluate_every_n_rounds: 1
  round_eval_dir: open_set_rounds
  save_round_scores: true

fed_digos:
  enabled: true
  # Fed-DiGOS = federated student classifier + disentangled student OSR generator.
  # The private RL teacher generator is not trained/aggregated for the main OSR path.
  detach_features: true
  batch_size: 256
  local_epochs: 2
  beta_kl: 0.02
  recon_weight: 1.0
  latent_nll_weight: 0.10
  grad_clip_norm: 5.0

  pseudo_unknown:
    enabled: true
    ratio: 0.50
    margin: 1.5
    margin_weight: 0.25
    mixup_alpha: 0.4
    mask_probability: 0.15
    noise_std: 0.05

  energy:
    enabled: true
    temperature: 1.0

  prototype:
    enabled: true
    num_prototypes_per_class: 4
    min_samples_per_prototype: 25

  aggregation:
    enabled: true
    min_samples: 500
    min_label_coverage: 0.5
    min_class_entropy: 0.3
    min_score_gap: 0.0
    quality_target_gap: 0.5

  evt:
    classwise: true
    threshold_method: mef
    tail_size_percent: 0.10
    mef_min_quantile: 0.70
    mef_max_quantile: 0.98
    mef_num_candidates: 40
    min_errors_per_class: 50
    min_tail_size: 20
    target_known_fpr: 0.05
    fit_correct_only: true

  logging:
    save_scores: true
    save_quantiles: true
    save_overlap_report: true
