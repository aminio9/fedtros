name: evt
enabled: true
method: fed_digos

evt:
  enabled: true
  backend: fed_digos
  unknown_label_id: -1
  open_set_label_id: 99
  evaluate_each_round: false
  evaluate_every_n_rounds: 1
  round_eval_dir: open_set_rounds
  save_round_scores: true

fed_digos:
  enabled: true
  # Fed-DiGOS = federated student classifier + disentangled student OSR generator.
  # The private RL teacher generator is not trained/aggregated for the main OSR path.
  detach_features: true
  batch_size: 256
  local_epochs: 2
  beta_kl: 0.02
  recon_weight: 1.0
  # Smoke-test diagnostics showed raw reconstruction beats recon+NLL; keep NLL small.
  latent_nll_weight: 0.02
  grad_clip_norm: 5.0

  pseudo_unknown:
    enabled: true
    # Use harder, near-boundary pseudo-unknowns. Earlier defaults made fake
    # unknowns too easy and did not teach FoT-like Normal-adjacent rejection.
    ratio: 1.00
    margin: 0.40
    margin_weight: 0.15
    mixup_alpha: 1.0
    mask_probability: 0.05
    noise_std: 0.01

  energy:
    enabled: true
    temperature: 1.0
    # Smoke test showed FoT has lower raw energy than known samples.
    # Options: low, high, two_sided.
    rank_direction: low

  score_fusion:
    # Continuous rank fusion is the AUROC score and default reject rule.
    # Global rank calibration performed much better than class-wise Normal-tail
    # calibration for FoT->Normal failures. EVT thresholds are still saved for diagnostics.
    method: mean_rank
    calibration_scope: global
    generator_score_column: recon_error
    decision_rule: fused_rank_threshold

  prototype:
    enabled: true
    # Normal traffic is broad/multi-modal; using more prototypes avoids one huge
    # Normal ball swallowing FoT.
    num_prototypes_per_class: 16
    min_samples_per_prototype: 25

  aggregation:
    enabled: true
    min_samples: 500
    min_label_coverage: 0.5
    min_class_entropy: 0.3
    min_score_gap: 0.0
    quality_target_gap: 0.5

  evt:
    classwise: true
    threshold_method: mef
    tail_size_percent: 0.10
    mef_min_quantile: 0.70
    mef_max_quantile: 0.98
    mef_num_candidates: 40
    min_errors_per_class: 50
    min_tail_size: 20
    target_known_fpr: 0.05
    fit_correct_only: true

  logging:
    save_scores: true
    save_quantiles: true
    save_overlap_report: true
