name: evt
enabled: true
evt:
  enabled: true
  # Main v7 default: global student feature-distance EVT.
  # Options:
  #   student_feature_evt  -> main method, class-wise Mahalanobis feature boundary
  #   dual_boundary_evt    -> feature EVT + support-gated local generator EVT
  #   teacher_generator    -> legacy local generator reconstruction EVT
  backend: student_feature_evt
  score: mahalanobis_feature_distance
  classwise: true
  threshold_method: mef       # mef | quantile | fixed
  tail_size_percent: 0.10
  mef_min_quantile: 0.70
  mef_max_quantile: 0.98
  mef_num_candidates: 40
  min_errors_per_class: 50
  min_tail_size: 20
  target_known_fpr: 0.05
  fit_correct_only: true
  unknown_label_id: -1
  open_set_label_id: 99
  covariance: diagonal_shrinkage
  covariance_eps: 0.0001
  # Used by the optional local generator reconstruction boundary.
  error_scale_factor: 100000.0
  # DKD-FedOS performs one clean final global open-set evaluation after FL.
  # Enable only for client-side ablation/debug of local generator dual-boundary.
  client_eval_enabled: false
  dual_boundary:
    enabled: false
    rule: or
    local_generator_enabled: true
    local_min_clean_count: 100
    local_max_known_reject_rate: 0.10
    local_evt_threshold_method: mef
    local_tail_size_percent: 0.10
    save_client_artifacts: true
  # Kept only for old artifacts/tests. v7 uses class-wise thresholds.
  decision_threshold: 0.5
