name: prototype_distance
enabled: true
scorer:
  name: prototype_distance
  normalize_features: true
  score_direction: higher_unknown
  threshold_mode: validation_known_fpr
  target_known_fpr: 0.05
evt:
  enabled: false
  score: prototype_distance
  tail_fraction: null
  tail_percent: 1.0
  tail_size_percent: null
