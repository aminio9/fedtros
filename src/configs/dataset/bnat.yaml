name: B-NAT
registry_name: bnat
raw_path: data/raw/BNaT.csv
label_column: label
# Official source: https://avitech-vnu.github.io/BNaT/#/
# Repository landing page: https://github.com/avitech-vnu/BNaT
# Local canonical CSV used by the pipeline: data/raw/BNaT.csv
# Source labels present in the raw CSV: Normal, BP, DoS, MitM, FoT
# Primary open-set protocol: keep FoT as the held-out unknown attack.
source_url: https://github.com/avitech-vnu/BNaT
source_labels:
  - Normal
  - BP
  - DoS
  - MitM
  - FoT
known_labels:
  - Normal
  - BP
  - DoS
  - MitM
external_datasets:
  - B-TAT
  - ToN-IoT
  - CIC-IDS2017
preprocessing:
  mode: single_source
  output_dir: data/processed
  raw_file: ${dataset.raw_path}
  label_column: ${dataset.label_column}
  known_labels: ${dataset.known_labels}
  numerical_cols: null
  categorical_cols: null
  numeric_threshold: 0.9
  train_split: 0.8
  validation_split: 0.1
  test_split: 0.1
  closed_set_test_size: 0.2
  num_clients: ${federated.num_clients}
  alpha: 100.0
  iid: false
  unknown_label_id: -1
