name: B-NAT
registry_name: bnat
raw_path: data/raw/BNaT.csv
label_column: label
# Official source: https://avitech-vnu.github.io/BNaT/#/
# Repository landing page: https://github.com/avitech-vnu/BNaT
# Local canonical CSV used by the pipeline: data/raw/BNaT.csv
# Source labels present in the raw CSV: Normal, BP, DoS, MitM, FoT
# Primary open-set protocol: keep FoT as the held-out unknown attack.
# Closed-set experiment overlays override known_labels to the full source label set.
source_url: https://github.com/avitech-vnu/BNaT
source_labels:
  - Normal
  - BP
  - DoS
  - MitM
  - FoT
closed_set_num_classes: 5
open_set_num_classes: 4
known_labels:
  - Normal
  - BP
  - DoS
  - MitM
unknown_labels:
  - FoT
external_datasets:
  - B-TAT
  - ToN-IoT
  - CIC-IDS2017
partition_file: null
preprocessing:
  mode: single_source
  protocol: open_set
  output_dir: data/processed
  raw_file: ${dataset.raw_path}
  label_column: ${dataset.label_column}
  source_labels: ${dataset.source_labels}
  known_labels: ${dataset.known_labels}
  unknown_labels: ${dataset.unknown_labels}
  numerical_cols: null
  categorical_cols: null
  numeric_threshold: 0.9
  categorical_schema_scope: known_train
  expected_feature_dim: null
  train_split: 0.8
  validation_split: 0.1
  test_split: 0.1
  closed_set_test_size: 0.2
  num_clients: ${federated.num_clients}
  alpha: 100.0
  iid: false
  unknown_label_id: -1
  smoke: false
  smoke_min_samples_per_client: 1
  smoke_max_samples_per_class: 512
