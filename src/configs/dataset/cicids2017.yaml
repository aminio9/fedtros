name: CIC-IDS2017
registry_name: cicids2017
raw_path: data/raw/CIC-IDS2017.csv
label_column: Label
source_url: https://www.unb.ca/cic/datasets/ids-2017.html
source_labels:
  - BENIGN
  - Bot
  - DDoS
  - DoS GoldenEye
  - DoS Hulk
  - DoS Slowhttptest
  - DoS slowloris
  - FTP-Patator
  - Heartbleed
  - Infiltration
  - PortScan
  - SSH-Patator
  - Web Attack-Brute Force
  - Web Attack-Sql Injection
  - Web Attack-XSS
closed_set_num_actions: 15
open_set_num_actions: 9
known_labels:
  - BENIGN
  - DDoS
  - DoS GoldenEye
  - DoS Hulk
  - DoS Slowhttptest
  - DoS slowloris
  - FTP-Patator
  - PortScan
  - SSH-Patator
unknown_labels:
  - Bot
  - Heartbleed
  - Infiltration
  - Web Attack-Brute Force
  - Web Attack-Sql Injection
  - Web Attack-XSS
preprocessing:
  mode: single_source
  protocol: open_set
  output_dir: data/processed
  raw_file: ${dataset.raw_path}
  label_column: ${dataset.label_column}
  source_labels: ${dataset.source_labels}
  known_labels: ${dataset.known_labels}
  unknown_labels: ${dataset.unknown_labels}
  require_all_source_labels: true
  drop_duplicates: true
  max_samples_per_class: 20000
  read_chunksize: 100000
  numerical_cols: null
  categorical_cols: null
  numeric_threshold: 0.9
  categorical_schema_scope: known_train
  closed_set_test_size: 0.2
  validation_split: 0.125
  num_clients: ${federated.num_clients}
  min_samples_per_client: 32
  partition_max_attempts: 200
  alpha: 0.5
  iid: false
  max_unknown_test_ratio: 1.0
  unknown_label_id: -1
