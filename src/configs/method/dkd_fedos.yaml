# @package _global_
experiment:
  method: DKD-FedOS

federated:
  strategy:
    name: dkd_fedos
    aggregation_strategy: dkd_fedos
    # Sentinel-style server aggregation: normalized pseudo-gradients,
    # equal client weighting, and momentum. Only the compact student is shared.
    server_lr: 1.0
    server_momentum: 0.9
    min_reliable_samples: 500
    # Strict-FL reliability weighting: the server uses only num_examples, not
    # label histograms, label coverage, class entropy, or missing-class lists.
    # This preserves the non-IID method while avoiding server-side label statistics.
    student_aggregation_mode: reliability_weighted_average
    student_avg_warmup_rounds: 100
    normalized_server_momentum: 0.9
    reliability_reference_samples: 0  # legacy; v6 uses per-round max client samples
    reliability_min_weight: 0.01
    reliability_coverage_power: 0.0  # legacy/ignored in strict-FL aggregation
    reliability_entropy_power: 0.0   # legacy/ignored in strict-FL aggregation
    monitor_path: ${tracking.run_dir}/dkd_fedos_monitoring.jsonl
  server:
    proximal_mu: 0.0

training:
  # Keep RL stable under non-IID and class imbalance.
  reward_mode: class_balanced
  reward_weight_power: 0.5
  reward_min_weight: 0.5
  reward_max_weight: 3.0
  reward_normalize_mean: true
  epsilon_end: 0.05
  epsilon_decay_rate: 0.98
  min_buffer_size: 128

  # Sentinel-style DKD is trained from local dataset mini-batches, not only from RL replay.
  dkd_dataset_training: true
  # Safe default: DKD dataset batches train the student from a frozen RL teacher.
  # RL/replay remains the only default path updating prior_net/recognition_net/Q-head.
  dkd_dataset_update_teacher: false
  dkd_update_teacher_from_student: false
  dkd_local_epochs: 1
  dkd_dataset_min_steps: 50
  dkd_dataset_epochs_small_client: 10
  dkd_batch_size: 256
  dkd_label_smoothing: 0.02

  # Teacher Q-head supervised stabilizer.
  aux_ce_weight: 0.10
  aux_ce_label_smoothing: 0.02
  aux_ce_use_class_weights: true

  # DKD-FedOS student and Sentinel-inspired adaptive losses.
  # Stronger student: still lightweight versus CVAE-DQN/generator, but no
  # longer too weak to carry all-class global knowledge under harsh non-IID.
  dkd_student_hidden_dims: [512, 256, 128]
  dkd_student_activation: gelu
  dkd_student_norm: layernorm
  dkd_student_dropout: 0.05
  # Fed-DiGOS attaches a disentangled OSR generator branch to this student.
  dkd_student_osr_latent_dim: 8
  dkd_student_osr_hidden_dims: [128, 64]
  dkd_student_osr_decoder_hidden_dims: [64, 128]
  dkd_student_osr_dropout: 0.05
  dkd_student_osr_norm: layernorm
  dkd_student_osr_activation: gelu
  dkd_student_osr_detach_features: true
  dkd_student_osr_lr: 0.001
  dkd_student_osr_weight_decay: 0.0001
  dkd_student_open_set_enabled: true
  dkd_student_open_set_lr: 0.001
  dkd_student_open_set_weight_decay: 0.0001
  dkd_student_lr: 0.001
  # Local CE adapts even one-class clients, while the frozen global-student
  # anchor preserves logits for absent classes.
  dkd_student_full_ce_with_anchor: true
  dkd_global_anchor_weight: 2.0
  dkd_global_anchor_min_weight: 0.0
  dkd_global_anchor_coverage_power: 1.0
  dkd_eval_student_before_local: true
  dkd_teacher_task_weight: 0.0
  dkd_student_task_weight: 1.0
  dkd_kd_base_temperature: 3.0
  dkd_kd_min_temperature: 1.0
  dkd_kd_decay: 0.95
  dkd_teacher_to_student_start_round: 1
  # Disabled by default to protect RL teacher. Enable only after global student quality is proven.
  dkd_student_to_teacher_start_round: 999
  dkd_alignment_start_round: 2
  dkd_min_student_confidence: 0.0
  dkd_grad_clip_norm: 1.0
  dkd_lambda_kd_init: 0.20
  dkd_lambda_align_init: 0.08
  dkd_lambda_kd_min: 0.03
  dkd_lambda_kd_max: 0.35
  dkd_lambda_kd_max_base: 0.18
  dkd_lambda_kd_max_growth: 0.02
  dkd_lambda_align_min: 0.01
  dkd_lambda_align_max: 0.12
  dkd_lambda_align_max_base: 0.06
  dkd_lambda_align_max_growth: 0.01
  dkd_align_mse_weight: 1.0
  dkd_align_cos_weight: 0.5
  dkd_class_balance_beta: 0.999
  dkd_class_weight_min: 0.2
  dkd_class_weight_max: 5.0
  dkd_protect_absent_classes: true
