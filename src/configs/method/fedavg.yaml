# @package _global_
experiment:
  method: FedAvg

# Clean FedAvg baseline: reset local optimizer/replay/epsilon each round,
# keep shared-test client evaluation before/after local fit, and use central
# validation only for best-checkpoint selection.
federated:
  strategy:
    name: fedavg
    aggregation_strategy: fedavg
  server:
    proximal_mu: 0.0
    fraction_evaluate: 1.0
  central_evaluate:
    enabled: true
    data_path: ${paths.validation_data}
    prefix: val

training:
  reset_optimizer_each_round: true
  reset_replay_buffer_each_round: true
  reset_epsilon_each_round: true
  round_aware_seed: true
  evaluate_after_local_fit: true
  evaluate_before_local_fit: false
  aux_ce_weight: 0.0
  generator:
    enabled: false

checkpointing:
  monitor_metric: val/macro_f1
  monitor_mode: max
