# @package _global_
experiment:
  method: FedGPA

federated:
  strategy:
    name: fedgpa
    aggregation_strategy: fedgpa
    prototype_lambda: 0.05
    prototype_mu: 0.5
    prototype_feature: latent
    classifier_self_weight: 0.25
    distance_temperature: 1.0
    monitor_path: ${tracking.run_dir}/fedgpa_monitoring.jsonl
  server:
    proximal_mu: 0.0

training:
  batch_size: 64
  student_lr: 0.001
  student_weight_decay: 0.0001
  student_epochs: 2
