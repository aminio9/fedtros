study_id: A5-FEATURE
name: A5_feature_source
description: Feature-source gate; run only if the dedicated student OSR branch exists and is trained.
methods: [fedtros_pr]
datasets: [bnat]
alphas: [0.5]
iids: [false]
unknown_label_sets: [[FoT]]
known_labels: [Normal, BP, DoS, MitM]
num_clients: 10
seeds: [17, 42, 73, 101, 137]
variants:
  - name: student_embedding
    overrides: {training.student_osr_enabled: false, open_set.prototype_rank.prototype.feature_source: student_embedding}
  - name: osr_branch_embedding
    overrides: {training.student_osr_enabled: true, open_set.prototype_rank.prototype.feature_source: osr_mu}
