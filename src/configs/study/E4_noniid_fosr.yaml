study_id: E4-NIID-FOSR
name: E4_noniid_fosr
description: Central non-IID federated open-set benchmark with FoT held out.
methods: [fedtros_mc, fedavg, fedprox]
datasets: [bnat]
alphas: [1.0, 0.5, 0.1]
iids: [false]
unknown_label_sets: [[FoT]]
known_labels: [Normal, BP, DoS, MitM]
seeds: [17, 42, 73, 101, 137]
num_clients: 10
base_overrides:
  federated.num_rounds: 100
  training.local_epochs: 2
  evaluation.mode: open_set
