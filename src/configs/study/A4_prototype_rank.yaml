study_id: A4-PR
name: A4_prototype_rank
description: Matched detector ablation on the same seeded FedTROS student representation.
methods: [fedtros_mc]
datasets: [bnat]
alphas: [0.5]
iids: [false]
unknown_label_sets: [[FoT]]
known_labels: [Normal, BP, DoS, MitM]
num_clients: 10
seeds: [17, 42, 73, 101, 137]
variants:
  - name: multicenter_conformal
    overrides:
      method.canonical: true
      open_set.detector: multicenter_conformal
  - name: msp
    overrides:
      method.canonical: false
      training.canonical: true
      open_set.detector: prototype_rank
      open_set.prototype_rank.score_fusion.method: msp_rank
      open_set.prototype_rank.prototype.negative.enabled: false
  - name: energy
    overrides:
      method.canonical: false
      training.canonical: true
      open_set.detector: prototype_rank
      open_set.prototype_rank.score_fusion.method: energy_rank
      open_set.prototype_rank.prototype.negative.enabled: false
  - name: positive_only
    overrides:
      method.canonical: false
      training.canonical: true
      open_set.detector: prototype_rank
      open_set.prototype_rank.prototype.negative.enabled: false
      open_set.prototype_rank.score_fusion.method: prototype_raw
  - name: boundary_raw
    overrides:
      method.canonical: false
      training.canonical: true
      open_set.detector: prototype_rank
      open_set.prototype_rank.prototype.negative.enabled: true
      open_set.prototype_rank.score_fusion.method: prototype_raw
  - name: prototype_rank
    overrides:
      method.canonical: false
      training.canonical: true
      open_set.detector: prototype_rank
      open_set.prototype_rank.prototype.negative.enabled: true
      open_set.prototype_rank.score_fusion.method: prototype_rank
base_overrides: {federated.num_rounds: 100, training.local_epochs: 2, evaluation.mode: open_set}
