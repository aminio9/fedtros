study_id: S1-SENSITIVITY
name: S1_sensitivity
description: Targeted sensitivity around claimed components; not a final-test hyperparameter sweep.
methods: [fedtros_mc]
datasets: [bnat]
alphas: [0.5]
iids: [false]
unknown_label_sets: [[FoT]]
known_labels: [Normal, BP, DoS, MitM]
seeds: [17, 42, 73, 101, 137]
num_clients: 10
variants:
  - name: beta0
    overrides: {training.teacher_beta_kl: 0.0}
  - name: beta_small
    overrides: {training.teacher_beta_kl: 0.001}
  - name: beta_canonical
    overrides: {training.teacher_beta_kl: 0.01}
  - name: beta_large
    overrides: {training.teacher_beta_kl: 0.05}
base_overrides: {federated.num_rounds: 100, training.local_epochs: 2, evaluation.mode: open_set}
