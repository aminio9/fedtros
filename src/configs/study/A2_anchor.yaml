study_id: A2-ANCHOR
name: A2_anchor
description: Coverage-adaptive anchor attribution under severe and moderate non-IID.
methods: [fedtros_pr]
datasets: [bnat]
alphas: [0.1, 0.5]
iids: [false]
unknown_label_sets: [[FoT]]
known_labels: [Normal, BP, DoS, MitM]
seeds: [17, 42, 73]
num_clients: 10
variants:
  - name: no_anchor
    overrides: {training.fedtros_global_anchor_weight: 0.0}
  - name: fixed_anchor
    overrides: {training.fedtros_global_anchor_coverage_power: 0.0}
  - name: adaptive_anchor
    overrides: {training.fedtros_global_anchor_coverage_power: 1.0}
base_overrides: {federated.num_rounds: 100, training.local_epochs: 2, evaluation.mode: open_set}
