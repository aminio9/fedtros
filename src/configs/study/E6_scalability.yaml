study_id: E6-SCALE
name: E6_scalability
description: Fixed-global-data federation fragmentation/scalability at 10, 50, and 100 clients.
methods: [fedtros_pr]
datasets: [bnat]
alphas: [0.5]
iids: [false]
unknown_label_sets: [[FoT]]
known_labels: [Normal, BP, DoS, MitM]
seeds: [17, 42, 73, 101, 137]
num_clients_values: [10, 50, 100]
# Engineering-only fixed-data analogue.  The canonical paper matrix above is
# intentionally unchanged and is used by paper_final/reproduction stages.
smoke_num_clients_values: [2, 3, 4]
base_overrides:
  federated.num_rounds: 100
  training.local_epochs: 2
  evaluation.mode: open_set
  open_set.evaluate_each_round: true
  open_set.evaluate_every_n_rounds: 5
