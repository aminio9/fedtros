num_clients: 3
num_rounds: 100
resume_from: null
# Add this when resuming a FedTROS student checkpoint so
# saved checkpoints continue from the previous round number. Example: 52
# means the next saved checkpoint will be round_0053.
resume_round_offset: 0
local_client_epochs: ${training.local_epochs}
evaluation_frequency: 1
client_resources:
  num_cpus: ${runtime.client_num_cpus}
  num_gpus: ${runtime.client_num_gpus}
client_id: 1
client_data_path: ${dataset.preprocessing.output_dir}/client_${federated.client_id}_train.pt
central_evaluate:
  enabled: false
  data_path: ${paths.validation_data}
  prefix: val
server:
  address: 127.0.0.1:8090
  num_rounds: ${federated.num_rounds}
  fraction_fit: 1.0
  fraction_evaluate: 1.0
  min_fit_clients: ${federated.num_clients}
  min_evaluate_clients: ${federated.num_clients}
  min_available_clients: ${federated.num_clients}
  proximal_mu: 0.0
strategy:
  name: fedtros_pr
  aggregation_strategy: fedtros_pr
  monitor_path: ${tracking.run_dir}/fedtros_pr_monitoring.jsonl
  student_aggregation_mode: support_weighted_average
  support_min_weight: 0.01
