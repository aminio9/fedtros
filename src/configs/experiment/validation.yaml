# @package _global_
experiment:
  id: VALIDATION
  name: tiny_e2e_validation
  family: validation
  method: FMRL_AVA
  pipeline: full
  description: Tiny end-to-end validation run for preprocessing, FL, evaluation, and plots.
  objective: Verify that the full pipeline runs without using the paper-scale budget.
federated:
  num_clients: 2
  num_rounds: 1
dataset:
  preprocessing:
    output_dir: ${tracking.run_dir}/processed
    alpha: 0.1
    iid: false
training:
  batch_size: 64
  local_episodes_per_round: 1
  steps_per_episode: 3
  min_buffer_size: 2
  generator:
    epochs_per_round: 1
open_set:
  evt:
    enabled: true
evaluation:
  batch_size: 2048
  export_latent_embeddings: false
tracking:
  run_id: tiny_e2e_validation_seed${seed}
