# @package _global_
experiment:
  id: E5
  name: exp5_ablation
  family: ablation
  method: FMRL_LA
  pipeline: full
  description: Module ablation and sensitivity checks.
  objective: Isolate EVT, generator, federation strategy, and heterogeneity effects.
  primary_metrics:
    - test/macro_f1
    - open_set/auroc
    - open_set/unknown_f1
  dependencies:
    - preprocessing
    - selected_training_pipeline
    - evaluation
  expected_artifacts:
    - evaluation_metrics.json
    - open_set_metrics.json
    - ablation_metrics.csv
federated:
  num_clients: 10
  num_rounds: 100
dataset:
  preprocessing:
    output_dir: ${tracking.run_dir}/processed
    alpha: 0.1
    iid: false
open_set:
  evt:
    enabled: true
evaluation:
  mode: open_set
  export_latent_embeddings: true
tracking:
  run_id: e5_${experiment.method}_alpha${dataset.preprocessing.alpha}_seed${seed}

