# @package _global_
experiment:
  id: E5
  name: exp5_multi_dataset_external_validation
  family: external_validation
  method: DKD-FedOS
  pipeline: full
  description: Multi-dataset open-set non-IID validation on external benchmarks.
  objective: Validate the model independently on B-TAT, ToN-IoT, and CIC-IDS2017.
  primary_metrics:
    - test/accuracy
    - test/macro_f1
    - open_set/auroc
    - open_set/unknown_f1
  dependencies:
    - preprocessing
    - federated_training
    - evt_calibration
    - open_set_evaluation
  expected_artifacts:
    - evaluation_metrics.json
    - open_set_metrics.json
    - open_set_scores.csv
    - open_set_roc_curve.csv
    - open_set_pr_curve.csv
    - communication_metrics.csv
    - latent_embeddings.csv
federated:
  num_clients: 10
  num_rounds: 100
model:
  num_actions: ${dataset.open_set_num_actions}
dataset:
  preprocessing:
    protocol: open_set
    source_labels: ${dataset.source_labels}
    known_labels: ${dataset.known_labels}
    unknown_labels: ${dataset.unknown_labels}
    output_dir: ${tracking.run_dir}/processed
    closed_set_test_size: 0.2
    validation_split: 0.125
    min_samples_per_client: 32
    partition_max_attempts: 200
    max_unknown_test_ratio: 1.0
    alpha: 0.5
    iid: false
open_set:
  evt:
    enabled: true
    backend: fed_digos
  fed_digos:
    enabled: true
    score_fusion:
      method: prototype_rank
    proser:
      enabled: false
training:
  local_episodes_per_round: 10
  dkd_student_osr_enabled: true
  dkd_student_open_set_enabled: true
  dkd_update_teacher_from_student: false
  generator:
    enabled: false
evaluation:
  mode: open_set
  export_latent_embeddings: true
tracking:
  run_id: e5_${dataset.registry_name}_noniid_alpha05_open_dkd_fedos_seed${seed}
