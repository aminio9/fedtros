# @package _global_
experiment:
  id: E6
  name: exp6_scalability_open_set
  family: scalability
  method: DKD-FedOS
  pipeline: full
  description: Scalability open-set test for DKD-FedOS/Fed-DiGOS under 50 and 100 clients.
  objective: Measure performance retention, open-set stability, runtime overhead, communication cost, and client fairness as federation size increases.
  primary_metrics:
    - openset_f1_macro
    - openset_auroc
    - openset_fpr95
    - mean_client_macro_f1
    - worst_client_macro_f1
  dependencies:
    - preprocessing
    - federated_training
    - per_round_open_set_evaluation
    - final_open_set_evaluation
  expected_artifacts:
    - evaluation_metrics.json
    - open_set_round_metrics.csv
    - scalability_round_metrics.csv
    - client_fit_fairness_metrics.csv
    - communication_metrics.csv
    - federated_history.csv
    - federated_summary.json

federated:
  num_clients: 50
  num_rounds: 100
  server:
    # Per-round global open-set evaluation gives the convergence curves.
    # Disable extra Flower client evaluation to avoid 5k/10k redundant shared-test evaluations.
    fraction_evaluate: 0.0

training:
  local_episodes_per_round: 10
  evaluate_after_local_fit: true
  dkd_student_osr_enabled: true
  dkd_student_open_set_enabled: true
  generator:
    enabled: false

dataset:
  known_labels:
    - Normal
    - BP
    - DoS
    - MitM
  preprocessing:
    output_dir: ${tracking.run_dir}/processed
    alpha: 0.5
    iid: false

open_set:
  evt:
    enabled: true
    backend: fed_digos
    evaluate_each_round: true
    evaluate_every_n_rounds: 1
    save_round_scores: false
  fed_digos:
    enabled: true
    proser:
      enabled: false
    score_fusion:
      method: prototype_rank

evaluation:
  mode: open_set
  export_latent_embeddings: true
  # Keep metrics, but avoid thousands of report/CM files in 50/100-client scalability runs.
  save_client_reports: false
  log_client_reports: false
  save_client_confusion_matrices: false

tracking:
  run_id: e6_scalability_${federated.num_clients}clients_alpha${dataset.preprocessing.alpha}_openset_fot_seed${seed}
