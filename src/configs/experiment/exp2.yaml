# @package _global_
experiment:
  id: E2
  name: exp2_open_set
  family: open_set
  method: FMRL_AVA
  pipeline: full
  description: EVT-based open-set detection with FoT held out as unknown.
  objective: Reject unknown attacks while preserving known-class predictions.
  primary_metrics:
    - open_set/auroc
    - open_set/auprc
    - open_set/fpr95
    - open_set/unknown_f1
  dependencies:
    - preprocessing
    - federated_training
    - evt_calibration
    - open_set_evaluation
  expected_artifacts:
    - open_set_metrics.json
    - open_set_scores.csv
    - open_set_roc_curve.csv
    - open_set_pr_curve.csv
    - evt/evt_models.pkl
federated:
  num_clients: 10
  num_rounds: 100
dataset:
  preprocessing:
    output_dir: ${tracking.run_dir}/processed
    alpha: 1.0
    iid: true
training:
  # Phase 1: train the global student reconstruction head only for open-set
  # experiments. Closed-set E1/E3 keep the old classifier-only behavior.
  generator:
    enabled: true
  dkd_student_reconstruction_enabled: true
  dkd_student_reconstruction_weight: 0.10
  dkd_student_decoder_hidden_dims: [128, 256]
  dkd_student_decoder_dropout: 0.05
  dkd_student_decoder_class_condition: true
open_set:
  evt:
    enabled: true
    backend: student_decoder
    classwise: true
    threshold_method: mef
evaluation:
  mode: open_set
  export_latent_embeddings: true
tracking:
  run_id: e2_${experiment.method}_iid_seed${seed}
