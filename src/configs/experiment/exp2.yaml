# @package _global_
experiment:
  id: E2
  name: exp2_open_set
  family: open_set
  method: FMRL_AVA
  pipeline: full
  description: EVT-based open-set detection with FoT held out as unknown.
  objective: Reject unknown attacks while preserving known-class predictions.
  primary_metrics:
    - open_set/auroc
    - open_set/auprc
    - open_set/fpr95
    - open_set/unknown_f1
  dependencies:
    - preprocessing
    - federated_training
    - evt_calibration
    - open_set_evaluation
  expected_artifacts:
    - open_set_metrics.json
    - open_set_scores.csv
    - open_set_roc_curve.csv
    - open_set_pr_curve.csv
    - evt/evt_models.pkl
federated:
  num_clients: 10
  num_rounds: 100
dataset:
  preprocessing:
    output_dir: ${tracking.run_dir}/processed
    alpha: 1.0
    iid: true
training:
  # Fed-DiGOS uses a student-owned disentangled OSR generator.
  # Local RL teacher generator training is disabled for the main paper method.
  generator:
    enabled: false
  dkd_student_osr_enabled: true
  dkd_student_open_set_enabled: true
open_set:
  method: fed_digos
  evt:
    enabled: true
    backend: fed_digos
    evaluate_each_round: true
    evaluate_every_n_rounds: 1
    round_eval_dir: open_set_rounds
    save_round_scores: true
  fed_digos:
    enabled: true
evaluation:
  mode: open_set
  export_latent_embeddings: true
tracking:
  run_id: e2_${experiment.method}_iid_seed${seed}
