# @package _global_
experiment:
  id: E1
  name: exp1_closed_set
  family: closed_set
  method: FMRL_LA
  pipeline: full
  description: Closed-set validation on known B-NAT classes.
  objective: Preserve known-class classification quality under the unified model.
  primary_metrics:
    - test/accuracy
    - test/balanced_accuracy
    - test/macro_f1
  dependencies:
    - preprocessing
    - federated_training
    - closed_set_evaluation
  expected_artifacts:
    - evaluation_metrics.json
    - test_metrics.json
    - test_confusion_matrix.csv
    - federated_history.csv
    - communication_metrics.csv
federated:
  num_clients: 10
  num_rounds: 100
dataset:
  preprocessing:
    output_dir: ${tracking.run_dir}/processed
    alpha: 0.1
    iid: false
open_set:
  evt:
    enabled: false
evaluation:
  mode: closed_set
  export_latent_embeddings: false
tracking:
  run_id: e1_${experiment.method}_alpha${dataset.preprocessing.alpha}_seed${seed}

