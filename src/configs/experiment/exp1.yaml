# @package _global_
experiment:
  id: E1
  name: exp1_closed_set
  family: closed_set
  method: FMRL_AVA
  pipeline: full
  description: Closed-set validation on all B-NAT labels.
  objective: Preserve classification quality across the full B-NAT label set.
  primary_metrics:
    - test/accuracy
    - test/balanced_accuracy
    - test/macro_f1
  dependencies:
    - preprocessing
    - federated_training
    - closed_set_evaluation
  expected_artifacts:
    - evaluation_metrics.json
    - test_metrics.json
    - test_confusion_matrix.csv
    - federated_history.csv
    - communication_metrics.csv
federated:
  num_clients: 10
  num_rounds: 100
model:
  num_actions: 5
dataset:
  known_labels: ${dataset.source_labels}
  preprocessing:
    output_dir: ${tracking.run_dir}/processed
    closed_set_test_size: 0.1
    validation_split: 0.0
    alpha: 1.0
    iid: true
open_set:
  evt:
    enabled: false
training:
  generator:
    enabled: false
evaluation:
  mode: closed_set
  export_latent_embeddings: false
tracking:
  run_id: e1_${experiment.method}_iid_seed${seed}
