# @package _global_
experiment:
  id: E6
  name: exp6_efficiency
  family: efficiency
  method: FMRL_LA
  pipeline: full
  description: Efficiency and scalability over client count and round budget.
  objective: Measure runtime, communication cost, and accuracy per cost.
  primary_metrics:
    - test/accuracy
    - communication/cumulative_mb
    - federated/rounds
  dependencies:
    - preprocessing
    - federated_training
    - closed_set_evaluation
    - suite_artifact_export
  expected_artifacts:
    - communication_metrics.csv
    - federated_history.csv
    - evaluation_metrics.json
federated:
  num_clients: 10
  num_rounds: 100
dataset:
  preprocessing:
    output_dir: ${tracking.run_dir}/processed
    alpha: 0.1
    iid: false
open_set:
  evt:
    enabled: false
evaluation:
  mode: closed_set
  export_latent_embeddings: false
tracking:
  run_id: e6_${experiment.method}_clients${federated.num_clients}_seed${seed}

