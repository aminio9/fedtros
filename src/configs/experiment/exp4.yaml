# @package _global_
experiment:
  id: E4
  name: exp4_open_set_noniid
  family: combined_open_set_noniid
  method: FMRL_AVA
  pipeline: full
  description: Combined open-set detection and non-IID federated training.
  objective: Validate unknown rejection under heterogeneous client data.
  primary_metrics:
    - test/macro_f1
    - open_set/auroc
    - open_set/unknown_f1
  dependencies:
    - preprocessing
    - federated_training
    - evt_calibration
    - open_set_evaluation
  expected_artifacts:
    - evaluation_metrics.json
    - open_set_metrics.json
    - open_set_scores.csv
    - communication_metrics.csv
federated:
  num_clients: 10
  num_rounds: 100
dataset:
  preprocessing:
    output_dir: ${tracking.run_dir}/processed
    alpha: 0.1
    iid: false
open_set:
  evt:
    enabled: true
evaluation:
  mode: open_set
  export_latent_embeddings: true
tracking:
  run_id: e4_${experiment.method}_alpha${dataset.preprocessing.alpha}_seed${seed}

