# @package _global_
experiment:
  id: E4
  name: exp4_open_set_noniid
  family: combined_open_set_noniid
  method: FMRL_AVA
  pipeline: full
  description: Combined open-set detection and non-IID federated training.
  objective: Validate unknown rejection under heterogeneous client data.
  primary_metrics:
    - test/macro_f1
    - open_set/auroc
    - open_set/unknown_f1
  dependencies:
    - preprocessing
    - federated_training
    - evt_calibration
    - open_set_evaluation
  expected_artifacts:
    - evaluation_metrics.json
    - open_set_metrics.json
    - open_set_scores.csv
    - communication_metrics.csv
federated:
  num_clients: 10
  num_rounds: 100
dataset:
  preprocessing:
    output_dir: ${tracking.run_dir}/processed
    alpha: 0.1
    iid: false
training:
  # Phase 1: train the global student reconstruction head only for open-set
  # experiments. Closed-set E1/E3 keep the old classifier-only behavior.
  generator:
    enabled: true
  dkd_student_reconstruction_enabled: true
  dkd_student_reconstruction_weight: 0.10
  dkd_student_decoder_hidden_dims: [128, 256]
  dkd_student_decoder_dropout: 0.05
  dkd_student_decoder_class_condition: true
open_set:
  evt:
    enabled: true
    backend: student_decoder
    classwise: true
    threshold_method: mef
evaluation:
  mode: open_set
  export_latent_embeddings: true
tracking:
  run_id: e4_${experiment.method}_alpha${dataset.preprocessing.alpha}_seed${seed}

