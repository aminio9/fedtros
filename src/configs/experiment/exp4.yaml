# @package _global_
experiment:
  id: E4
  name: exp4_open_set_noniid
  family: combined_open_set_noniid
  method: FMRL_AVA
  pipeline: full
  description: Combined open-set detection and non-IID federated training.
  objective: Validate unknown rejection under heterogeneous client data.
  primary_metrics:
    - test/macro_f1
    - open_set/auroc
    - open_set/unknown_f1
  dependencies:
    - preprocessing
    - federated_training
    - evt_calibration
    - open_set_evaluation
  expected_artifacts:
    - evaluation_metrics.json
    - open_set_metrics.json
    - open_set_scores.csv
    - communication_metrics.csv
federated:
  num_clients: 10
  num_rounds: 100
dataset:
  preprocessing:
    output_dir: ${tracking.run_dir}/processed
    alpha: 0.1
    iid: false
training:
  # v7 open-set uses global-student feature-distance EVT. The local teacher
  # generator remains available only for the gated dual-boundary backend.
  generator:
    enabled: true
open_set:
  evt:
    enabled: true
    backend: student_feature_evt
    evaluate_each_round: true
    evaluate_every_n_rounds: 1
    round_eval_dir: open_set_rounds
    save_round_scores: false
    score: mahalanobis_feature_distance
    classwise: true
    threshold_method: mef
evaluation:
  mode: open_set
  export_latent_embeddings: true
tracking:
  run_id: e4_${experiment.method}_alpha${dataset.preprocessing.alpha}_seed${seed}

