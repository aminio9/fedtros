# @package _global_
experiment:
  id: E8
  name: exp8_labelwise_open_set
  family: labelwise_open_set
  method: FMRL_AVA
  pipeline: full
  description: Label-wise open-set stress test with one held-out attack label per run.
  objective: Demonstrate latent and decision separation under leave-one-attack-out splits.
  primary_metrics:
    - open_set/auroc
    - open_set/auprc
    - open_set/unknown_f1
    - test/accuracy
  dependencies:
    - preprocessing
    - federated_training
    - evt_calibration
    - open_set_evaluation
    - latent_projection_export
  expected_artifacts:
    - open_set_metrics.json
    - open_set_scores.csv
    - open_set_roc_curve.csv
    - open_set_pr_curve.csv
    - latent_embeddings.csv
federated:
  num_clients: 10
  num_rounds: 100
model:
  num_actions: 4
dataset:
  # Default representative holdout is MitM; the E8 script overrides this list per held-out label.
  known_labels:
    - Normal
    - BP
    - DoS
    - FoT
  preprocessing:
    output_dir: ${tracking.run_dir}/processed
    alpha: 1.0
    iid: true
training:
  # Exp8 is a label-wise open-set run. Keep the student OSR/prototype path active
  # and keep the private teacher generator disabled in the main method.
  generator:
    enabled: false
  dkd_student_osr_enabled: true
  dkd_student_open_set_enabled: true
open_set:
  method: fed_digos
  evt:
    enabled: true
    backend: fed_digos
    evaluate_each_round: true
    evaluate_every_n_rounds: 1
    round_eval_dir: open_set_rounds
    save_round_scores: true
  fed_digos:
    enabled: true
    score_fusion:
      method: prototype_rank
    proser:
      enabled: false
evaluation:
  mode: open_set
  export_latent_embeddings: true
tracking:
  run_id: e8_${experiment.method}_mitm_seed${seed}
