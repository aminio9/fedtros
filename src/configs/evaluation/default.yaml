batch_size: ${training.batch_size}
checkpoint_path: ${checkpoint.path}
closed_set_data: ${paths.closed_set_test_data}
open_set_data: ${paths.open_set_test_data}
class_names: ${paths.class_names}
output_dir: ${tracking.run_dir}
metrics:
  primary_closed_set:
    - accuracy
    - balanced_accuracy
    - macro_precision
    - macro_recall
    - macro_f1
  primary_open_set:
    - auroc
    - auprc
    - fpr95
    - unknown_detection_rate
    - unknown_f1
save_predictions: true
report_to_stdout: true
