# @package _global_
evaluation:
  batch_size: ${training.batch_size}
  checkpoint_path: ${checkpoint.path}
  validation_data: ${paths.validation_data}
  closed_set_data: ${paths.closed_set_test_data}
  open_set_data: ${paths.open_set_test_data}
  class_names: ${paths.class_names}
  output_dir: ${tracking.run_dir}
  mode: closed_set
  metrics:
    primary_closed_set:
      - accuracy
      - balanced_accuracy
      - macro_precision
      - macro_recall
      - macro_f1
    primary_open_set: []
  save_predictions: true
  report_to_stdout: true
  export_latent_embeddings: false
  latent_embeddings_output: ${evaluation.output_dir}/latent_embeddings.csv
  latent_embeddings_batch_size: ${evaluation.batch_size}
  latent_embeddings_max_points: 5000
open_set:
  evt:
    enabled: false

